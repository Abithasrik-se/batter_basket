server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/    { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
    location /admin/  { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
    location /static/ { alias /srv/static/; }
    location /media/  { alias /srv/media/; }

    # React single-page app: unknown paths return index.html
    location / { try_files $uri /index.html; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
}
